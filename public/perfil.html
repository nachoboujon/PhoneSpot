<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | PhoneSpot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="uploads/PhoneSpot-trans.png">
</head>
<body>
    
    <header>
        <div class="logo">
            <h1><a href="index.html" style="display:flex; align-items:center; gap:0.5rem;"><img src="uploads/PhoneSpot-trans.png" alt="PhoneSpot Logo" style="height:35px; width:auto; border-radius: 4px;"> PhoneSpot.</a></h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html?cat=all">Catálogo</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <a href="#" id="logout-btn" title="Cerrar Sesión"><i class="fa-solid fa-right-from-bracket"></i></a>
            <a href="#" onclick="event.preventDefault(); toggleFavSidebar();" title="Mis Favoritos" style="margin-right: 15px; font-size: 1.2rem; color: var(--text-color);"><i class="fa-regular fa-heart"></i></a>
            <a href="carrito.html" class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count-badge" style="font-size: 0.8rem; font-weight: bold; margin-left: 2px;"></span>
            </a>
        </div>
    </header>

    <main style="padding: 2rem 5%; max-width: 1000px; margin: 0 auto; min-height: 70vh;">
        <h2 style="font-size: 2.5rem; margin-bottom: 2rem;"><i class="fa-solid fa-circle-user"></i> Mi Perfil</h2>
        
        <div style="background: var(--gray-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color);">
            
        <div style="background: var(--gray-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 2rem;">
            

<h3 style="margin-bottom: 1.5rem; border-bottom: 2px solid #555555; display: inline-block; padding-bottom: 0.5rem;"><i class="fa-solid fa-box"></i> Mis Compras</h3>
            
            <div id="my-orders-container" style="display: flex; flex-direction: column; gap: 1rem;">
                <p style="color: var(--text-muted);">Cargando historial...</p>
            </div>
        </div>
    </main>

    <footer style="background-color: var(--text-color); color: #fff; padding: 5rem 5% 2rem; margin-top: 4rem;">
        <div class="footer-content" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 3rem; max-width: 1200px; margin: 0 auto; margin-bottom: 4rem;">
            <div class="footer-logo">
                <h2 style="font-size: 2.2rem; margin-bottom: 1rem; color: #fff; letter-spacing: -1px;">PhoneSpot.</h2>
                <p style="color: #aaa; line-height: 1.6; margin-bottom: 1.5rem;">Tu tienda de confianza para tecnología móvil.</p>
            </div>
        </div>
        <div style="border-top: 1px solid #333; padding-top: 2rem; text-align: center; color: var(--text-muted);">
            <p>&copy; 2026 PhoneSpot. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js?v=1787790983629"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('phoneSpotToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('phoneSpotToken');
                    localStorage.removeItem('phoneSpotRole');
                    window.location.href = 'index.html';
                });
            }

            const container = document.getElementById('my-orders-container');
            
            try {
                const res = await fetch(window.API_URL + '/api/my-orders', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const orders = await res.json();
                
                if (!res.ok) throw new Error(orders.error || 'Error al cargar');

                if (orders.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Aún no has realizado ninguna compra.</p>';
                    return;
                }

                container.innerHTML = '';
                orders.forEach(o => {
                    let statusHtml = '';
                    if (o.status === 'pending') statusHtml = '<span style="color: #e67e22; font-weight: bold;"><i class="fa-solid fa-clock"></i> Pendiente</span>';
                    else if (o.status === 'completed') statusHtml = '<span style="color: #555555; font-weight: bold;"><i class="fa-solid fa-check"></i> Pagado</span>';
                    else if (o.status === 'shipped') statusHtml = '<span style="color: #3498db; font-weight: bold; display:flex; flex-direction:column; align-items:flex-end; gap:5px;"><i class="fa-solid fa-truck-fast"></i> Enviado <a href="https://www.correoargentino.com.ar/formularios/e-commerce" target="_blank" style="background:#333; color:white; padding:4px 8px; border-radius:4px; font-size:0.75rem; text-decoration:none;"><i class="fa-solid fa-location-crosshairs"></i> Rastrear Pedido</a></span>';
                    else if (o.status === 'cancelled') statusHtml = '<span style="color: #e74c3c; font-weight: bold;"><i class="fa-solid fa-xmark"></i> Cancelado</span>';

                    let itemsHtml = o.order_items.map(item => `
                        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                            <img src="${item.products?.image_url || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                            <div style="font-size: 0.9rem;">
                                <strong>${item.quantity}x</strong> ${item.products?.name || 'Producto'} ${item.variant_name ? `(${item.variant_name})` : ''}<br>
                                <span style="color: var(--text-muted);">$${Number(item.price).toLocaleString('es-AR')} c/u</span>
                            </div>
                        </div>
                    `).join('');

                    container.innerHTML += `
                        <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                                <div>
                                    <h4 style="margin: 0; font-size: 1.1rem;">Orden #${o.id.substring(0,8)}</h4>
                                    <small style="color: var(--text-muted);">${new Date(o.created_at).toLocaleString()}</small>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 1.2rem; font-weight: bold;">$${Number(o.total).toLocaleString('es-AR')}</div>
                                    <div style="margin-top: 0.3rem;">${statusHtml}</div>
                                </div>
                            </div>
                            
                            <div>${itemsHtml}</div>
                            
                            ${o.tracking_code ? `
                            <div style="margin-top: 1.5rem; background: #e8f4f8; padding: 1rem; border-radius: 6px; border-left: 4px solid #3498db;">
                                <h5 style="margin: 0 0 0.5rem 0; color: #2980b9;"><i class="fa-solid fa-location-crosshairs"></i> Código de Seguimiento</h5>
                                <p style="margin: 0; font-family: monospace; font-size: 1.1rem; font-weight: bold;">${o.tracking_code}</p>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });

            } catch (err) {
                container.innerHTML = '<p style="color: red;">Error al cargar tus compras: ' + err.message + '</p>';
            }
        });
    </script>

    <!-- WhatsApp Flotante -->
    <a href="https://wa.me/5493447416011" class="whatsapp-float" target="_blank" title="Chatea con nosotros">
        <i class="fa-brands fa-whatsapp"></i>
    </a>


    <!-- FAVORITES SIDEBAR -->
    <div id="fav-sidebar-overlay" onclick="toggleFavSidebar()" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; opacity: 0; visibility: hidden; transition: 0.3s;"></div>
    <div id="fav-sidebar" style="position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: var(--bg-color); z-index: 1100; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease; display: flex; flex-direction: column;">
        <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg);">
            <h3 style="margin: 0; color: var(--text-color); font-size: 1.5rem;"><i class="fa-solid fa-heart" style="color: #ff4757; margin-right: 10px;"></i> Mis Favoritos</h3>
            <button onclick="toggleFavSidebar()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="fav-sidebar-items" style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Renderizado por JS -->
        </div>
    </div>

</body>
</html>
