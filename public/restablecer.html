<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | PhoneSpot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="min-height:100vh; display:grid; place-items:center; padding:1rem; background:#f6f6f6;">
    <main style="width:min(100%,470px); background:#fff; padding:2.5rem; border-radius:18px; box-shadow:0 12px 35px rgba(0,0,0,.08);">
        <div style="width:52px;height:52px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-size:1.4rem;margin-bottom:1rem;"><i class="fa-solid fa-lock"></i></div>
        <h1 style="font-size:2rem; margin:0 0 .6rem;">Creá una nueva contraseña</h1>
        <p style="color:#666; line-height:1.55; margin-bottom:1.5rem;">Elegí una contraseña de al menos 8 caracteres.</p>
        <form id="reset-password-form" style="display:grid;gap:1rem;">
            <input id="reset-password" type="password" required minlength="8" placeholder="Nueva contraseña" style="padding:1rem;border:1px solid #ddd;border-radius:10px;font:inherit;">
            <input id="reset-password-confirm" type="password" required minlength="8" placeholder="Repetir contraseña" style="padding:1rem;border:1px solid #ddd;border-radius:10px;font:inherit;">
            <button type="submit" class="btn" style="padding:1rem;">Actualizar contraseña</button>
        </form>
        <p id="reset-password-message" style="display:none;margin:1rem 0 0;line-height:1.5;"></p>
    </main>
    <script src="script.js?v=20260908"></script>
    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = new URLSearchParams(window.location.search).get('token');
            const password = document.getElementById('reset-password').value;
            const confirmation = document.getElementById('reset-password-confirm').value;
            const message = document.getElementById('reset-password-message');
            if (!token || password !== confirmation) { message.style.display='block'; message.style.color='#c0392b'; message.textContent = !token ? 'El enlace no es válido.' : 'Las contraseñas no coinciden.'; return; }
            const button = event.currentTarget.querySelector('button'); button.disabled=true; button.textContent='Actualizando...';
            try {
                const response = await fetch(window.API_URL + '/api/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token,password}) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                message.style.display='block'; message.style.color='#168344'; message.textContent=data.message;
                setTimeout(() => window.location.href='login.html', 1800);
            } catch (error) { message.style.display='block'; message.style.color='#c0392b'; message.textContent=error.message || 'No se pudo actualizar la contraseña.'; }
            finally { button.disabled=false; button.textContent='Actualizar contraseña'; }
        });
    </script>
</body>
</html>
