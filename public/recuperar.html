<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | PhoneSpot</title>
    <link rel="stylesheet" href="style.css?v=20260904-responsive">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="min-height:100vh; display:grid; place-items:center; padding:1rem; background:#f6f6f6;">
    <main style="width:min(100%,470px); background:#fff; padding:2.5rem; border-radius:18px; box-shadow:0 12px 35px rgba(0,0,0,.08);">
        <a href="login.html" style="color:#555; text-decoration:none; font-size:.9rem;"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
        <div style="width:52px;height:52px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-size:1.4rem;margin:1.6rem 0 1rem;"><i class="fa-solid fa-key"></i></div>
        <h1 style="font-size:2rem; margin:0 0 .6rem;">Recuperá tu contraseña</h1>
        <p style="color:#666; line-height:1.55; margin-bottom:1.5rem;">Ingresá el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</p>
        <form id="forgot-password-form" style="display:grid;gap:1rem;">
            <input id="forgot-password-email" type="email" required placeholder="tu@email.com" style="padding:1rem;border:1px solid #ddd;border-radius:10px;font:inherit;">
            <button type="submit" class="btn" style="padding:1rem;">Enviar enlace de recuperación</button>
        </form>
        <p id="forgot-password-message" style="display:none;margin:1rem 0 0;line-height:1.5;"></p>
    </main>
    <script src="script.js?v=20260908"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('forgot-password-email').value.trim();
            const button = event.currentTarget.querySelector('button');
            const message = document.getElementById('forgot-password-message');
            button.disabled = true; button.textContent = 'Enviando...';
            try {
                const response = await fetch(window.API_URL + '/api/request-password-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
                const data = await response.json();
                message.style.display = 'block'; message.style.color = '#168344'; message.textContent = data.message;
                event.currentTarget.reset();
            } catch (_) {
                message.style.display = 'block'; message.style.color = '#c0392b'; message.textContent = 'No pudimos procesar tu solicitud. Intentá nuevamente.';
            } finally { button.disabled = false; button.textContent = 'Enviar enlace de recuperación'; }
        });
    </script>
</body>
</html>
