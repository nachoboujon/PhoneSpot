<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! | PhoneSpot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    
    
    <div style="background: var(--card-bg); padding: 4rem 2rem; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); max-width: 500px; width: 90%;">
        <div style="width: 80px; height: 80px; background: #555555; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;">
            <i class="fa-solid fa-check" style="color: white; font-size: 2.5rem;"></i>
        </div>
        
        <h1 style="margin-bottom: 1rem; font-size: 2rem; color: var(--text-color);">¡Compra Confirmada!</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.5; margin-bottom: 2rem;">
            Tu orden ha sido procesada correctamente. Hemos enviado los detalles a tu correo electrnico.
        </p>

        <div style="background: #f0f4f8; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
            <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">Sers redirigido al inicio en <strong id="countdown">5</strong> segundos...</p>
        </div>

        <a href="index.html" class="btn btn-block" style="display: inline-block;">Volver al Inicio</a>
    </div>

    <script>
        let count = 5;
        const countSpan = document.getElementById('countdown');
        setInterval(() => {
            count--;
            if (count > 0) countSpan.innerText = count;
        }, 1000);

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 5000);
    </script>

    <!-- WhatsApp Flotante -->
    <a href="https://wa.me/5493447416011" class="whatsapp-float" target="_blank" title="Chatea con nosotros">
        <i class="fa-brands fa-whatsapp"></i>
    </a>


    <!-- FAVORITES SIDEBAR -->
    <div id="fav-sidebar-overlay" onclick="toggleFavSidebar()" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; opacity: 0; visibility: hidden; transition: 0.3s;"></div>
    <div id="fav-sidebar" style="position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: var(--bg-color); z-index: 1100; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease; display: flex; flex-direction: column;">
        <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg);">
            <h3 style="margin: 0; color: var(--text-color); font-size: 1.5rem;"><i class="fa-solid fa-heart" style="color: #ff4757; margin-right: 10px;"></i> Mis Favoritos</h3>
            <button onclick="toggleFavSidebar()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="fav-sidebar-items" style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Renderizado por JS -->
        </div>
    </div>

</body>
</html>
