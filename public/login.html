<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | PhoneSpot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <header>
        <div class="logo"><h1><a href="index.html" style="display:flex; align-items:center; gap:0.5rem;"><img src="uploads/PhoneSpot-trans.png" alt="PhoneSpot Logo" style="height:35px; width:auto; border-radius: 4px;"> PhoneSpot.</a></h1></div>
    </header>
    <main class="checkout-page" style="min-height: 70vh; display:flex; justify-content:center; align-items:center;">
        <div class="checkout-form" style="width: 100%; max-width: 400px; background: var(--gray-bg); padding: 3rem; border-radius: 20px;">
            <h2 style="text-align:center; font-size: 2rem;">Acceso</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="log-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="log-password" required>
                </div>
                <button type="submit" class="btn btn-block">Entrar</button>
            </form>
            <p style="text-align:center; margin-top: 1rem;"><a href="register.html" style="color: var(--text-color);">¿No tienes cuenta? Regístrate</a></p>
        </div>
    </main>
    <script src="script.js?v=1787186967602"></script>

    <!-- WhatsApp Flotante -->
    <a href="https://wa.me/5493447416011" class="whatsapp-float" target="_blank" title="Chatea con nosotros">
        <i class="fa-brands fa-whatsapp"></i>
    </a>


    <!-- FAVORITES SIDEBAR -->
    <div id="fav-sidebar-overlay" onclick="toggleFavSidebar()" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; opacity: 0; visibility: hidden; transition: 0.3s;"></div>
    <div id="fav-sidebar" style="position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: var(--bg-color); z-index: 1100; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease; display: flex; flex-direction: column;">
        <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--card-bg);">
            <h3 style="margin: 0; color: var(--text-color); font-size: 1.5rem;"><i class="fa-solid fa-heart" style="color: #ff4757; margin-right: 10px;"></i> Mis Favoritos</h3>
            <button onclick="toggleFavSidebar()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="fav-sidebar-items" style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Renderizado por JS -->
        </div>
    </div>

</body>
</html>
